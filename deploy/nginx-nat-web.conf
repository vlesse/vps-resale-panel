# *.nat.renrenyings.net —— NAT 机器的二级域名入口
#
# 面板只写 /etc/nginx/vps-panel-nat.map 这一个文件（域名 -> 机器内网地址:80），
# 这份站点配置是人工装的，面板不碰。
#
# 泛域名证书：
#   certbot certonly --dns-cloudflare #     --dns-cloudflare-credentials /root/.secrets/cloudflare.ini #     -d '*.nat.renrenyings.net'
# 证书就位之后，把下面 443 那一段的注释去掉再 nginx -t && systemctl reload nginx。

map $host $panel_nat_backend {
    default "";
    include /etc/nginx/vps-panel-nat.map;
}

# WebSocket 用得上。买家在自己机器上跑什么我们不知道，别把长连接掐了。
map $http_upgrade $panel_nat_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^m\d+\.nat\.renrenyings\.net$;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # 映射里没有这个域名 = 机器已经退订或者根本不存在
        if ($panel_nat_backend = "") { return 404; }

        proxy_pass http://$panel_nat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $panel_nat_upgrade;

        # 买家自己的站点，上传多大我们不管
        client_max_body_size 512m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

