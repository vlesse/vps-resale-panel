# *.nat.renrenyings.net —— NAT 机器的二级域名入口
#
# 面板只写 /etc/nginx/vps-panel-nat.map 这一个文件（域名 -> 机器内网地址:80），
# 这份站点配置是人工装的，面板不碰。
#
# 证书有两种办法，二选一：
#
# 一、每台机器一张（默认，什么凭据都不用）
#     下面 443 段里用 $ssl_server_name 按 SNI 取证书，
#     面板下发时会自动给还没有证书的域名补签（HTTP 验证）。
#
# 二、一张泛域名证书（需要 DNS 服务商的 API 凭据）
#     certbot certonly --dns-cloudflare #       --dns-cloudflare-credentials /root/.secrets/cloudflare.ini #       -d '*.nat.example.com'
#     然后把 443 段里 ssl_certificate 那两行换成写死的泛域名证书路径。
#     面板检测到泛域名证书存在就不再逐台签。

map $host $panel_nat_backend {
    default "";
    include /etc/nginx/vps-panel-nat.map;
}

# WebSocket 用得上。买家在自己机器上跑什么我们不知道，别把长连接掐了。
map $http_upgrade $panel_nat_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^m\d+\.nat\.renrenyings\.net$;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # 映射里没有这个域名 = 机器已经退订或者根本不存在
        if ($panel_nat_backend = "") { return 404; }

        proxy_pass http://$panel_nat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $panel_nat_upgrade;

        # 买家自己的站点，上传多大我们不管
        client_max_body_size 512m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^m\d+\.nat\.renrenyings\.net$;

    # 按 SNI 取证书：每台机器一张，面板自动补签。
    # 换成泛域名证书的话，把这两行改成写死的路径：
    #   ssl_certificate     /etc/letsencrypt/live/nat.renrenyings.net/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/nat.renrenyings.net/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        if ($panel_nat_backend = "") { return 404; }

        proxy_pass http://$panel_nat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $panel_nat_upgrade;

        client_max_body_size 512m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
