# ============================================================
#  面板跑在已有 Nginx 后面时的站点配置
#
#  配合 deploy/compose.behind-nginx.yml 使用。
#  把 vps.renrenyings.net 换成你自己的域名，放进
#  /etc/nginx/sites-available/ 并做软链到 sites-enabled/，
#  然后 certbot --nginx -d 你的域名 让它自己补上证书那几行。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name vps.renrenyings.net;

    # certbot 续期时要用这个路径做 HTTP-01 验证，别把它一起 301 走了
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vps.renrenyings.net;

    ssl_certificate     /etc/letsencrypt/live/vps.renrenyings.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.renrenyings.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 上传机器私钥、粘贴服务账号 JSON 都会走 POST，默认 1m 不够
    client_max_body_size 20m;

    # 建机接口要等云厂商回话，一分钟起步。默认 60s 会在用户眼前断掉。
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:3110;
    }

    # 支付平台的异步回调。这条必须能通，否则用户付了钱订单不会变成已支付。
    location /payments/ {
        proxy_pass http://127.0.0.1:3110;
    }

    # 其余全部交给前端。Next.js 的热更新和 RSC 流式响应要 Upgrade 头。
    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
