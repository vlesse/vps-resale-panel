  <rect x="7" y="18" width="34" height="4" fill="#0b2570"/>
  <!-- card chip -->
  <rect x="11" y="24" width="7" height="5" rx="1" fill="#fbbf24"/>
  <rect x="22" y="25" width="4" height="2" rx="0.5" fill="#94a3b8"/>
  <rect x="22" y="28" width="6" height="2" rx="0.5" fill="#94a3b8"/>
  <rect x="30" y="25" width="6" height="2" rx="0.5" fill="#94a3b8"/>
  <rect x="30" y="28" width="4" height="2" rx="0.5" fill="#94a3b8"/>
  <!-- ABA wordmark -->
  <text x="24" y="43" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#dbeafe" text-anchor="middle">ABA PayWay</text>
</svg>
