<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 · RenrenYings Cloud</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="top"><div class="wrap row between">
    <a class="brand" href="/">RenrenYings <span>Cloud</span></a>
    <a href="/login.html">已有账号</a>
  </div></header>
  <form class="panel" onsubmit="registerFormSubmit(event)">
    <h1>创建账号</h1>
    <p>注册后可购买套餐、查看交付信息与续费。</p>
    <label>昵称</label>
    <input id="displayName" placeholder="可选" />
    <label>邮箱</label>
    <input id="email" type="email" required />
    <label>密码</label>
    <input id="password" type="password" required minlength="6" />
    <label>图形验证码</label>
    <div class="captcha-row">
      <input id="captchaCode" required placeholder="输入图中字符" autocomplete="off" />
      <button type="button" id="captchaImg" class="captcha-img" title="点击换一张" onclick="refreshCaptcha()">加载中…</button>
    </div>
    <div class="form-actions">
      <button class="btn primary" type="submit">注册</button>
      <a class="btn ghost" href="/login.html">去登录</a>
    </div>
    <div id="msg" class="msg"></div>
  </form>
  <script src="/assets/app.js?v=20260804a"></script>
  <script>document.addEventListener('DOMContentLoaded', refreshCaptcha);</script>
</body>
</html>
